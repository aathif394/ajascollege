name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Don't cancel in-flight deploys when CMS saves stack up — wait in queue.
# (cancel-in-progress caused "red X" noise and wasted partial deploys.)
concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing. Add it in GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is missing. Add it in GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Lightweight token check before a full build (saves ~1m when token is dead)
          code=$(curl -s -o /tmp/cf-token-check.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify" \
            || true)
          # tokens/verify may 404 on some token types; fall back to account endpoint
          if [ "$code" != "200" ]; then
            code=$(curl -s -o /tmp/cf-token-check.json -w "%{http_code}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}" \
              || true)
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Cloudflare API token is invalid or lacks access (HTTP $code). Create a new API token with Account → Cloudflare Pages → Edit, then update repo secret CLOUDFLARE_API_TOKEN. This is NOT a CMS content problem."
            cat /tmp/cf-token-check.json 2>/dev/null || true
            exit 1
          fi
          echo "Cloudflare credentials look valid."

      - name: Install
        run: npm ci

      - name: Build (Astro + Pagefind)
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name ajascollege --branch main
